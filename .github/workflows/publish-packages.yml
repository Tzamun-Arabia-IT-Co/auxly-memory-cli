name: publish-packages

# One-off / manual publisher for npm + PyPI via OIDC Trusted Publishing —
# no NPM_TOKEN / PYPI_API_TOKEN secrets, no OTP, nothing to expire. The
# registries verify the workflow's OIDC identity against the trusted
# publisher registered on each package's settings page:
#   repo: Tzamun-Arabia-IT-Co/auxly-memory-cli
#   workflow filename: publish-packages.yml
#
# Run it with: gh workflow run publish-packages.yml
# (The v1.5.0 tag's release.yml keeps its tag-scoped guard; this workflow
# publishes from whatever main holds, so only dispatch it when the wrapper
# versions in npm/ and pip/ are the version you intend to ship.)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC — the whole point; the registries trust this identity

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm (trusted publishing)
        working-directory: npm
        run: npm publish --access public --provenance

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: pip
        run: python -m pip install --upgrade build && python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip/dist
