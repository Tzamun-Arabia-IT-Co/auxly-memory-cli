name: release

# Fires when you push a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  goreleaser:
    # Only release from the public repo (it holds the Homebrew tap token). The
    # private mirror shares this workflow but lacks that secret, so guard it out —
    # otherwise a tag landing on the private repo triggers a spurious "release
    # failed" run at the cask-publish step.
    if: github.repository == 'Tzamun-Arabia-IT-Co/auxly-memory-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog is complete

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # H2/H3: minisign is required for the goreleaser `signs` step that signs the
      # checksum manifest. Install it and materialize the private key from a secret.
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Write minisign signing key
        shell: bash
        run: printf '%s' "${{ secrets.MINISIGN_KEY }}" > "${RUNNER_TEMP}/minisign.key"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Default token: creates the Release + uploads assets in THIS repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # minisign signing of the checksum manifest (H2/H3).
          MINISIGN_KEY_FILE: ${{ runner.temp }}/minisign.key
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          # PAT (repo scope): lets goreleaser push the formula to the tap repo.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Gemini/Antigravity Live Usage OAuth clients — injected into release
          # binaries via ldflags (see .goreleaser.yaml). Absent → empty → those two
          # usage meters report "unavailable"; everything else still builds.
          GEMINI_CLIENT_ID: ${{ secrets.GEMINI_CLIENT_ID }}
          GEMINI_CLIENT_SECRET: ${{ secrets.GEMINI_CLIENT_SECRET }}
          ANTIGRAVITY_CLIENT_ID: ${{ secrets.ANTIGRAVITY_CLIENT_ID }}
          ANTIGRAVITY_CLIENT_SECRET: ${{ secrets.ANTIGRAVITY_CLIENT_SECRET }}

  # Publish the npm + pip wrapper packages AFTER the release (and its signed
  # checksum manifest) exist, so the wrappers can download+verify the matching
  # binaries. Both packages just wrap the same GitHub release assets.
  #
  # Publishes via OIDC trusted publishing (npm provenance + PyPI trusted
  # publisher): the registries verify this workflow's identity directly —
  # no NPM_TOKEN / PYPI_API_TOKEN secrets, nothing to expire, immune to the
  # package-level 2FA policy. Requires the trusted publisher registered on
  # each package's settings page pointing at this repo + "release.yml".
  publish-packages:
    needs: goreleaser
    if: github.repository == 'Tzamun-Arabia-IT-Co/auxly-memory-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC credential the registries trust
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version (strip leading v)
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # --- npm (auxly-cli) ---
      # node 24 + current npm: OIDC trusted-publishing auth needs npm >= 11.5 —
      # node 20's bundled npm 10 signs provenance but sends the PUT unauthenticated
      # (registry answers 404).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        working-directory: npm
        run: |
          npm install -g npm@latest
          npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
          npm publish --access public --provenance

      # --- pip (auxly-cli) ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        working-directory: pip
        run: |
          python -m pip install --upgrade build
          V="${{ steps.ver.outputs.version }}"
          sed -i "s/^version = .*/version = \"$V\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" auxly_cli/_runner.py
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pip/dist
